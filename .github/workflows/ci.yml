name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ROS 2 Jazzy build + test
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: ws/src/so101-control

      - name: Install dependencies
        working-directory: ws
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy

      - name: Build
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Test
        working-directory: ws
        run: |
          source install/setup.bash
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure
          colcon test-result --verbose

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ws/log
            ws/build/*/test_results

  docker:
    name: Docker image build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t so101-control .

      - name: Check the workspace is installed in the image
        run: |
          for pkg in so101_description so101_hardware so101_bringup; do
            docker run --rm so101-control ros2 pkg prefix "$pkg"
          done
          docker run --rm so101-control \
            test -x /ws/install/so101_hardware/lib/so101_hardware/fake_servo_bus
